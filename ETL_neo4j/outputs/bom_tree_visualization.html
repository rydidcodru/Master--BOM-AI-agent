<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOM Tree Visualization</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dce3;
      --accent: #006f6b;
      --accent-2: #b6402a;
      --soft: #e9f4f2;
      --mark: #fff2a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Malgun Gothic", sans-serif;
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 16px 22px 14px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
      height: 36px;
      padding: 0 10px;
      font: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 600;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      padding: 18px 22px 30px;
      align-items: start;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric, aside, .tree-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric {
      padding: 12px 14px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }
    .metric .value {
      font-size: 22px;
      font-weight: 700;
    }
    .tree-wrap {
      padding: 14px 16px;
      overflow: auto;
      min-height: 68vh;
    }
    .tree, .tree ul {
      list-style: none;
      margin: 0;
      padding-left: 22px;
      position: relative;
    }
    .tree {
      padding-left: 0;
    }
    .tree ul::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line);
    }
    .node {
      position: relative;
      margin: 6px 0;
    }
    .node::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 17px;
      width: 14px;
      height: 1px;
      background: var(--line);
    }
    .tree > .node::before {
      display: none;
    }
    .row {
      display: grid;
      grid-template-columns: 24px minmax(270px, 1fr) 100px 76px 92px;
      gap: 10px;
      align-items: center;
      min-height: 34px;
      padding: 5px 8px;
      border-radius: 6px;
    }
    .row:hover {
      background: #f0f3f6;
    }
    .toggle {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 4px;
      line-height: 20px;
      text-align: center;
      background: var(--soft);
      border-color: #badbd6;
      color: var(--accent);
    }
    .toggle.empty {
      visibility: hidden;
    }
    .title {
      min-width: 0;
    }
    .name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      height: 24px;
      border-radius: 999px;
      background: #edf0f2;
      color: #344054;
      font-size: 12px;
      padding: 0 8px;
      white-space: nowrap;
    }
    .level-1 > .row { border-left: 4px solid var(--accent); }
    .level-2 > .row { border-left: 4px solid #3d8b7d; }
    .level-3 > .row { border-left: 4px solid #8a9a5b; }
    .level-4 > .row { border-left: 4px solid var(--accent-2); }
    .hidden { display: none; }
    mark {
      background: var(--mark);
      padding: 0 2px;
    }
    aside {
      position: sticky;
      top: 102px;
      padding: 14px;
    }
    aside h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    .detail {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 8px 10px;
      line-height: 1.35;
      word-break: break-word;
    }
    .detail .k {
      color: var(--muted);
      font-size: 12px;
    }
    .empty-state {
      color: var(--muted);
      padding: 20px 4px;
    }
    @media (max-width: 980px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      main { grid-template-columns: 1fr; }
      aside { position: static; }
      .summary { grid-template-columns: 1fr; }
      .row { grid-template-columns: 24px minmax(210px, 1fr) 76px; }
      .row .optional { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>BOM Tree Visualization</h1>
    <div class="toolbar">

  </header>
  <main>
    <section>

      <div class="tree-wrap">
        <ul id="tree" class="tree"></ul>
      </div>
    </section>
    <aside>

    </aside>
  </main>

.2", "partType": "포장물", "baseNo": "MAB62761347", "newNo": "←", "name": "Angle", "qty": 2, "supplier": "-", "classification": "Common", "changingPoint": "-", "parentId": "n397"}, {"id": "n402", "no": 402, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "RAB00557001", "newNo": "←", "name": "Tape,PETP", "qty": 0.41, "supplier": "서브원", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n403", "no": 403, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "RAB33679005", "newNo": "←", "name": "Tape,Polyester", "qty": 0.26, "supplier": "서브원", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n404", "no": 404, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "MFZ63953010", "newNo": "←", "name": "Packing,Accessory", "qty": 1, "supplier": "칠성산업", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n405", "no": 405, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "3858W3ZA03G", "newNo": "←", "name": "Bag,Sheet", "qty": 1, "supplier": "서브원", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n406", "no": 406, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "RAB00557201", "newNo": "←", "name": "Tape,OPP", "qty": 1, "supplier": "서브원", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n407", "no": 407, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "3Z90435C", "newNo": "←", "name": "Band", "qty": 0.0099, "supplier": "서브원", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n408", "no": 408, "level": 2, "bomLevel": "..2", "partType": "포장물", "baseNo": "8PPP5B80001", "newNo": "←", "name": "Resin,PP", "qty": 0.1188, "supplier": "GS칼텍스", "classification": "Common", "changingPoint": "-", "parentId": "n407"}, {"id": "n409", "no": 409, "level": 1, "bomLevel": ".1", "partType": "포장물", "baseNo": "RAB00557101", "newNo": "←", "name": "Film,Polyethylene(PE)", "qty": 0.72, "supplier": "서브원", "classification": "Common", "changingPoint": "-", "parentId": ""}, {"id": "n410", "no": 410, "level": 1, "bomLevel": ".1", "partType": "ETC", "baseNo": "MFL70959911", "newNo": "MFL70959953", "name": "Manual,Service", "qty": 1, "supplier": "-", "classification": "New", "changingPoint": "신규 Manual", "parentId": ""}];
    const flatById = new Map(flat.map(d => [d.id, d]));
    const collapsed = new Set();
    const treeEl = document.getElementById("tree");
    const detailsEl = document.getElementById("details");
    const searchEl = document.getElementById("search");
    const depthEl = document.getElementById("depth");

    function nodeText(node) {
      return [node.name, node.newNo, node.baseNo, node.partType, node.supplier, node.classification, node.no].join(" ").toLowerCase();
    }

    function hasMatch(node, query) {
      if (!query) return true;
      if (nodeText(node).includes(query)) return true;
      return node.children.some(child => hasMatch(child, query));
    }

    function highlight(text, query) {
      text = String(text || "");
      if (!query) return escapeHtml(text);
      const idx = text.toLowerCase().indexOf(query);
      if (idx < 0) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) + "<mark>" + escapeHtml(text.slice(idx, idx + query.length)) + "</mark>" + escapeHtml(text.slice(idx + query.length));
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const maxDepth = Number(depthEl.value);
      treeEl.innerHTML = "";
      roots.forEach(node => {
        const li = renderNode(node, query, maxDepth);
        if (li) treeEl.appendChild(li);
      });
    }

    function renderNode(node, query, maxDepth) {
      if (node.level > maxDepth || !hasMatch(node, query)) return null;
      const li = document.createElement("li");
      li.className = `node level-${Math.min(node.level, 4)}`;
      li.dataset.id = node.id;

      const row = document.createElement("div");
      row.className = "row";

      const hasChildren = node.children.some(child => child.level <= maxDepth && hasMatch(child, query));
      const button = document.createElement("button");
      button.className = "toggle" + (hasChildren ? "" : " empty");
      button.textContent = collapsed.has(node.id) ? "+" : "-";
      button.title = collapsed.has(node.id) ? "펼치기" : "접기";
      button.addEventListener("click", event => {
        event.stopPropagation();
        collapsed.has(node.id) ? collapsed.delete(node.id) : collapsed.add(node.id);
        render();
      });
      row.appendChild(button);

      const title = document.createElement("div");
      title.className = "title";
      title.innerHTML = `<div class="name">${highlight(node.name || "(부품명 없음)", query)}</div>
        <div class="sub">No. ${escapeHtml(node.no)} · ${escapeHtml(node.newNo || node.baseNo)} · ${escapeHtml(node.partType)}</div>`;
      row.appendChild(title);

      const level = document.createElement("span");
      level.className = "pill";
      level.textContent = `Lv ${node.level}`;
      row.appendChild(level);

      const qty = document.createElement("span");
      qty.className = "pill optional";
      qty.textContent = node.qty === "" ? "Qty -" : `Qty ${node.qty}`;
      row.appendChild(qty);

      const cls = document.createElement("span");
      cls.className = "pill optional";
      cls.textContent = node.classification || "-";
      row.appendChild(cls);

      row.addEventListener("click", () => selectNode(node.id));
      li.appendChild(row);

      if (hasChildren && !collapsed.has(node.id)) {
        const ul = document.createElement("ul");
        node.children.forEach(child => {
          const childLi = renderNode(child, query, maxDepth);
          if (childLi) ul.appendChild(childLi);
        });
        if (ul.children.length) li.appendChild(ul);
      }
      return li;
    }

    function selectNode(id) {
      const node = flatById.get(id);
      if (!node) return;
      detailsEl.className = "detail";
      detailsEl.innerHTML = [
        ["No.", node.no],
        ["BOM Level", node.bomLevel],
        ["Part Type", node.partType],
        ["Base P/No", node.baseNo],
        ["New P/No", node.newNo],
        ["부품명", node.name],
        ["Q'ty", node.qty],
        ["Supplier", node.supplier],
        ["Classification", node.classification],
        ["Changing Point", node.changingPoint],
      ].map(([k, v]) => `<div class="k">${escapeHtml(k)}</div><div>${escapeHtml(v || "-")}</div>`).join("");
    }

    document.getElementById("expand").addEventListener("click", () => {
      collapsed.clear();
      render();
    });
    document.getElementById("collapse").addEventListener("click", () => {
      flat.forEach(node => collapsed.add(node.id));
      render();
    });
    searchEl.addEventListener("input", render);
    depthEl.addEventListener("change", render);

    flat.forEach(node => {
      if (node.level >= 2) collapsed.add(node.id);
    });
    render();
  </script>
