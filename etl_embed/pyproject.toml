[project]
name = "etl"
version = "0.2.0"
description = "Excel → Postgres + pgvector ETL for dev part master"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
# BGE-M3 임베딩 (dense + sparse). GPU 권장.
# torch는 환경별로 별도 설치 (CUDA/CPU 버전 차이 때문). pip install torch --index-url ...
embed = [
    "FlagEmbedding>=1.3.0",
    "numpy>=1.26",
]

[tool.uv]
dev-dependencies = []
